<!doctype html>
<html th:classappend="${isDarkMode} ? dark" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <title>User Management</title>
</head>
<body>
<section layout:fragment="content">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-slate-800 dark:text-white tracking-tight">User Access Management</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Admin control panel to manage user credentials, active statuses, and system permissions.</p>
        </div>

        <!-- Add User Form Panel -->
        <div class="bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800/80 rounded-xl p-6 shadow-sm mb-8">
            <h2 class="text-sm font-semibold text-slate-800 dark:text-white mb-4 uppercase tracking-wider">Create New Account</h2>
            <form th:attr="hx-post=@{/web/profile/users/add}" hx-target="#users-table-body" hx-swap="beforeend" _="on submit reset() me" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-2">Username</label>
                    <input type="text" name="username" required placeholder="Enter username..."
                           class="w-full text-sm px-3.5 py-2.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-2">Password</label>
                    <input type="password" name="password" required placeholder="••••••••"
                           class="w-full text-sm px-3.5 py-2.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-2">Initial Role</label>
                    <select name="role" required class="w-full text-sm px-3.5 py-2.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500 cursor-pointer">
                        <option value="USER" selected>Standard User</option>
                        <option value="ADMIN">Administrator</option>
                    </select>
                </div>
                <div>
                    <button type="submit" class="w-full inline-flex justify-center items-center gap-1.5 px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold transition-colors shadow-sm cursor-pointer whitespace-nowrap">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                        Create User
                    </button>
                </div>
            </form>
        </div>

        <!-- Users Table -->
        <div class="bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800/80 rounded-xl shadow-sm overflow-hidden">
            <table class="min-w-full divide-y divide-slate-100 dark:divide-slate-800/80">
                <thead class="bg-slate-50 dark:bg-slate-950/40">
                <tr>
                    <th scope="col" class="px-6 py-3.5 text-left text-xs font-semibold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Username</th>
                    <th scope="col" class="px-6 py-3.5 text-left text-xs font-semibold tracking-wider text-slate-500 dark:text-slate-400 uppercase">System Permissions</th>
                    <th scope="col" class="px-6 py-3.5 text-left text-xs font-semibold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Status</th>
                    <th scope="col" class="px-6 py-3.5 text-left text-xs font-semibold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Actions</th>
                </tr>
                </thead>
                <tbody id="users-table-body" class="divide-y divide-slate-100 dark:divide-slate-800/60 bg-white dark:bg-slate-900">
                <th:block th:each="user : ${users}">
                    <tr th:fragment="user-row" th:id="'user-' + ${user.userId}">
                        <!-- Username -->
                        <td class="px-6 py-5 whitespace-nowrap">
                            <div class="flex items-center gap-3">
                                <span class="p-2 bg-slate-100 dark:bg-slate-800/50 text-slate-600 dark:text-slate-400 rounded-lg">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                </span>
                                <div>
                                    <div class="text-sm font-semibold text-slate-800 dark:text-white" th:text="${user.username}">Username</div>
                                    <div class="text-[10px] text-slate-400 font-mono mt-0.5" th:text="${user.userId}">ID</div>
                                </div>
                            </div>
                        </td>

                        <!-- Permissions Radio Selection -->
                        <td class="px-6 py-5 whitespace-nowrap">
                            <div class="flex items-center gap-6">
                                <!-- Standard User -->
                                <label class="inline-flex items-center gap-2 cursor-pointer text-xs font-medium text-slate-700 dark:text-slate-300">
                                    <input type="radio" 
                                           th:name="'role-' + ${user.userId}" 
                                           value="USER" 
                                           th:checked="${user.roles.?[roleName == 'USER'].size() > 0}"
                                           th:attr="hx-post=@{/web/profile/users/{id}/role(id=${user.userId}, role='USER')}"
                                           hx-target="closest tr"
                                           hx-swap="outerHTML"
                                           class="w-4 h-4 text-indigo-600 border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:ring-1 focus:ring-indigo-500">
                                    Standard User (Read-Only)
                                </label>
                                <!-- Administrator -->
                                <label class="inline-flex items-center gap-2 cursor-pointer text-xs font-medium text-slate-700 dark:text-slate-300">
                                    <input type="radio" 
                                           th:name="'role-' + ${user.userId}" 
                                           value="ADMIN" 
                                           th:checked="${user.roles.?[roleName == 'ADMIN'].size() > 0}"
                                           th:attr="hx-post=@{/web/profile/users/{id}/role(id=${user.userId}, role='ADMIN')}"
                                           hx-target="closest tr"
                                           hx-swap="outerHTML"
                                           class="w-4 h-4 text-indigo-600 border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:ring-1 focus:ring-indigo-500">
                                    Administrator (Full Control)
                                </label>
                            </div>
                        </td>

                        <!-- Status Badge & Quick-Toggle Button -->
                        <td class="px-6 py-5 whitespace-nowrap text-sm">
                            <div class="flex items-center gap-3">
                                <span th:if="${user.enabled}" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 dark:bg-emerald-950/30 dark:text-emerald-400">
                                    Active
                                </span>
                                <span th:if="${!user.enabled}" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-50 text-slate-600 dark:bg-slate-800/40 dark:text-slate-400">
                                    Disabled
                                </span>

                                <button th:attr="hx-post=@{/web/profile/users/{id}/toggle(id=${user.userId})}"
                                        hx-target="closest tr"
                                        hx-swap="outerHTML"
                                        class="text-xs font-semibold text-indigo-600 hover:text-indigo-500 dark:text-indigo-400 dark:hover:text-indigo-300 hover:underline cursor-pointer">
                                    <span th:text="${user.enabled ? 'Disable' : 'Enable'}">Toggle</span>
                                </button>
                            </div>
                        </td>

                        <!-- Delete Action -->
                        <td class="px-6 py-5 whitespace-nowrap text-sm font-medium">
                            <button hx-confirm="Are you sure you want to delete this user account?"
                                    th:attr="hx-delete=@{/web/profile/users/{id}/delete(id=${user.userId})}"
                                    hx-target="closest tr"
                                    hx-swap="outerHTML"
                                    class="inline-flex items-center gap-1 p-1.5 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/20 transition-all cursor-pointer">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-10v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </td>
                    </tr>
                </th:block>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
