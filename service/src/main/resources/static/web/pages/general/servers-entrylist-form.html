<!doctype html>
<html th:classappend="${isDarkMode} ? dark" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <title>Edit Driver Entry</title>
</head>
<body>
<section layout:fragment="content">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 dark:text-white tracking-tight" th:text="${index != null && index >= 0 ? 'Edit Driver Entry' : 'Add New Driver Entry'}">Add Driver Entry</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1" th:text="'Server ID: ' + ${instance.id}"></p>
            </div>
            <a th:href="@{/web/servers/{id}/edit/entrylist(id=${instance.id})}" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-sm font-semibold transition-colors shadow-sm">
                Cancel
            </a>
        </div>

        <!-- Configuration Form -->
        <form th:action="@{/web/servers/{id}/edit/entrylist/save(id=${instance.id})}" method="POST" class="bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800/80 rounded-xl p-6 shadow-sm">
            <input type="hidden" name="index" th:value="${index}">

            <!-- Driver Info Section -->
            <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-4 border-b border-slate-100 dark:border-slate-800/60 pb-2">Driver Details</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">First Name</label>
                    <input type="text" name="firstName" required maxlength="64" th:value="${driver != null ? driver.firstName : ''}" class="w-full mt-1 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Last Name</label>
                    <input type="text" name="lastName" required maxlength="64" th:value="${driver != null ? driver.lastName : ''}" class="w-full mt-1 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Short Name (3-letter tag)</label>
                    <input type="text" name="shortName" required maxlength="3" th:value="${driver != null ? driver.shortName : ''}" class="w-full mt-1 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Steam Player ID</label>
                    <input type="text" name="playerID" required maxlength="64" th:value="${driver != null ? driver.playerID : ''}" class="w-full mt-1 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Driver Category</label>
                    <select name="driverCategory" class="w-full mt-1 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-white">
                        <option value="0" th:selected="${driver != null && driver.driverCategory == 0}">Bronze (0)</option>
                        <option value="1" th:selected="${driver != null && driver.driverCategory == 1}">Silver (1)</option>
                        <option value="2" th:selected="${driver != null && driver.driverCategory == 2}">Gold (2)</option>
                        <option value="3" th:selected="${driver != null && driver.driverCategory == 3}">Platinum (3)</option>
                    </select>
                </div>
            </div>

            <!-- Car & Slot Details -->
            <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-4 border-b border-slate-100 dark:border-slate-800/60 pb-2">Car & Team Details</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Team Name / Custom Car Name</label>
                    <input type="text" name="customCar" required maxlength="64" th:value="${entry != null ? entry.customCar : ''}" class="w-full mt-1 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Race Number</label>
                    <input type="number" name="raceNumber" required min="1" max="999" th:value="${entry != null ? entry.raceNumber : 42}" class="w-full mt-1 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Ballast (Kg)</label>
                    <input type="number" name="ballastKg" required min="0" max="100" th:value="${entry != null ? entry.ballastKg : 0}" class="w-full mt-1 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Restrictor %</label>
                    <input type="number" name="restrictor" required min="0" max="100" th:value="${entry != null ? entry.restrictor : 0}" class="w-full mt-1 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Is Server Admin</label>
                    <select name="isServerAdmin" class="w-full mt-1 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-white">
                        <option value="0" th:selected="${entry != null && entry.isServerAdmin == 0}">No</option>
                        <option value="1" th:selected="${entry != null && entry.isServerAdmin == 1}">Yes</option>
                    </select>
                </div>
            </div>

            <!-- Footer Controls -->
            <div class="flex justify-end gap-3 border-t border-slate-100 dark:border-slate-800 pt-4">
                <a th:href="@{/web/servers/{id}/edit/entrylist(id=${instance.id})}" class="px-4 py-2 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold transition-colors">
                    Cancel
                </a>
                <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-semibold transition-colors shadow-sm">
                    Save Entry
                </button>
            </div>
        </form>
    </div>
</section>
</body>
</html>

<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.setAttribute('data-original', input.value);
            input.addEventListener('input', checkChange);
            input.addEventListener('change', checkChange);
        });

        function checkChange(e) {
            const input = e.target;
            const original = input.getAttribute('data-original');
            let changed = input.value !== original;
            
            const highlightClass = 'ring-2 ring-amber-500/30 border-amber-500 bg-amber-50/30 dark:bg-amber-950/20';
            const classes = highlightClass.split(' ');
            
            if (changed) {
                classes.forEach(c => input.classList.add(c));
            } else {
                classes.forEach(c => input.classList.remove(c));
            }
        }

        // Form dirty checking to prevent accidental navigation away
        let isSubmitting = false;
        const form = document.querySelector('form');
        if (form) {
            form.addEventListener('submit', function() {
                isSubmitting = true;
            });
        }

        function isFormDirty() {
            let dirty = false;
            inputs.forEach(input => {
                const original = input.getAttribute('data-original');
                if (original !== null) {
                    let changed = false;
                    if (input.type === 'hidden') {
                        changed = false;
                    } else {
                        changed = input.value !== original;
                    }
                    if (changed) {
                        dirty = true;
                    }
                }
            });
            return dirty;
        }

        window.addEventListener('beforeunload', function (e) {
            if (!isSubmitting && isFormDirty()) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    });
</script>
