<!doctype html>
<html th:classappend="${isDarkMode} ? dark" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <title>Add Server</title>
</head>
<body>
<section layout:fragment="content">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold text-slate-800 dark:text-white mb-6">Add New Server</h1>
        <form th:action="@{/web/servers/add}" method="POST" class="bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800/80 rounded-xl p-6 shadow-sm">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Server Name</label>
                    <input type="text" name="name" required class="w-full mt-1 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Preset Event</label>
                    <select name="presetId" class="w-full mt-1 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-white">
                        <option value="">None (Default)</option>
                        <option th:each="preset : ${presets}" th:value="${preset.eventId}" th:text="${preset.eventName}"></option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">TCP Port</label>
                    <input type="number" name="tcpPort" min="1" max="65535" required class="w-full mt-1 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">UDP Port</label>
                    <input type="number" name="udpPort" min="1" max="65535" required class="w-full mt-1 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-white">
                </div>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Execution Mode</label>
                <div class="flex gap-4 mt-2">
                    <label class="flex items-center gap-2 text-slate-700 dark:text-slate-300">
                        <input type="radio" name="controlType" value="DOCKER" checked class="text-indigo-600"> Docker Container
                    </label>
                    <label class="flex items-center gap-2 text-slate-700 dark:text-slate-300">
                        <input type="radio" name="controlType" value="NATIVE" class="text-indigo-600"> Native Executable
                    </label>
                </div>
            </div>
            <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-semibold">Create Server</button>
        </form>
    </div>
</section>
</body>
</html>
