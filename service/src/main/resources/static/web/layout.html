<!DOCTYPE html>
<html th:classappend="${isDarkMode} ? dark" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <script type="text/javascript" th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/hyperscript.org/dist/_hyperscript.js}"></script>
    <link th:rel="stylesheet" th:href="@{/web/assets/css/style.build.tailwind.css}">
    <style>
        .htmx-indicator {
            background-color: #374151;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-slate-900">
<nav class="bg-white border-gray-200 dark:bg-gray-900">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-center mx-auto p-4">
        <!-- Burger Menu Button -->
        <button _="on click toggle .hidden on #navbar-default"
                type="button" 
                class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600">
            <span class="sr-only">Open main menu</span>
            <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
            </svg>
        </button>
        <!-- Navigation Menu -->
        <div class="hidden w-full md:block md:w-auto" id="navbar-default">
            <div class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-gray-100 rounded-lg md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 dark:border-gray-700">
                <a th:href="@{/}" class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">Home</a>
                <a th:href="@{/web/servers}" class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">Servers</a>
                <a th:href="@{/web/configs}" class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">Event Presets</a>
                <a sec:authorize="hasAuthority('write.instance')" th:href="@{/web/profile/details}" class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">Profile</a>
                <a sec:authorize="isAuthenticated()" th:href="@{/web/logout}" class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">Logout</a>
                <a sec:authorize="isAnonymous()" th:href="@{/web/sign-in}" class="text-gray-300 hover:bg-gray-700 hover:text-white rounded-md px-3 py-2 text-sm font-medium">Login</a>
            </div>
        </div>
    </div>
</nav>

<!-- Fixed Toast Notifications (Top Right, floating above all) -->
<div class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 w-full max-w-sm pointer-events-none">
    <!-- Success / Info Message -->
    <div th:if="${!#strings.isEmpty(message)}"
         class="pointer-events-auto flex items-center p-4 rounded-xl bg-blue-50 dark:bg-blue-950/40 text-blue-800 dark:text-blue-300 border border-blue-100 dark:border-blue-900/30 shadow-lg backdrop-blur-md transition-all duration-500 ease-out"
         role="alert"
         _="on load wait 6s then transition my opacity to 0 over 0.5s then remove me">
        <div class="flex-shrink-0">
            <svg class="w-5 h-5 text-blue-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
            </svg>
        </div>
        <div class="ml-3 text-sm font-semibold flex-1" th:text="${message}">Message text</div>
        <button type="button" onclick="this.parentElement.remove()" class="ml-auto text-blue-500 hover:text-blue-800 dark:hover:text-blue-200 p-1 rounded-lg hover:bg-blue-100 dark:hover:bg-blue-900/50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <!-- Database Info Message -->
    <div th:if="${!#strings.isEmpty(dbMessage)}"
         class="pointer-events-auto flex items-center p-4 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 text-indigo-800 dark:text-indigo-300 border border-indigo-100 dark:border-indigo-900/30 shadow-lg backdrop-blur-md transition-all duration-500 ease-out"
         role="alert"
         _="on load wait 6s then transition my opacity to 0 over 0.5s then remove me">
        <div class="flex-shrink-0">
            <svg class="w-5 h-5 text-indigo-500" fill="currentColor" viewBox="0 0 20 20">
                <path d="M3 12v3c0 1.657 3.134 3 7 3s7-1.343 7-3v-3M3 12c0 1.657 3.134 3 7 3s7-1.343 7-3M3 12c0-1.657 3.134-3 7-3s7 1.343 7 3M3 6c0 1.657 3.134 3 7 3s7-1.343 7-3M3 6c0-1.657 3.134-3 7-3s7 1.343 7 3"></path>
            </svg>
        </div>
        <div class="ml-3 text-sm font-semibold flex-1" th:text="${dbMessage}">Database message text</div>
        <button type="button" onclick="this.parentElement.remove()" class="ml-auto text-indigo-500 hover:text-indigo-800 dark:hover:text-indigo-200 p-1 rounded-lg hover:bg-indigo-100 dark:hover:bg-indigo-900/50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <!-- Error Message -->
    <div th:if="${!#strings.isEmpty(error)}"
         class="pointer-events-auto flex items-center p-4 rounded-xl bg-rose-50 dark:bg-rose-950/40 text-rose-800 dark:text-rose-300 border border-rose-100 dark:border-rose-900/30 shadow-lg backdrop-blur-md transition-all duration-500 ease-out"
         role="alert"
         _="on load wait 6s then transition my opacity to 0 over 0.5s then remove me">
        <div class="flex-shrink-0">
            <svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        <div class="ml-3 text-sm font-semibold flex-1" th:text="${error}">Error message text</div>
        <button type="button" onclick="this.parentElement.remove()" class="ml-auto text-rose-500 hover:text-rose-800 dark:hover:text-rose-200 p-1 rounded-lg hover:bg-rose-100 dark:hover:bg-rose-900/50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>
</div>

<main class="pt-8 pb-12">
    <section layout:fragment="content">
        <p>Page content goes here</p>
    </section>
</main>
<footer class="bg-gray-600 dark:bg-gray-800">
    <div class="w-full mx-auto max-w-screen-xl p-4 md:flex md:items-center md:justify-between">
        <span class="text-sm text-gray-500 sm:text-center dark:text-white-200 block rounded-md">Rendered at <span
                th:text="${#dates.format(now, 'dd/MMM/yyyy HH:mm')}"></span></span>
        <ul class="flex flex-wrap items-center mt-3 text-sm font-medium text-gray-300 sm:mt-0">
            <li>
                <a th:href="@{/web/sign-up}"
                   class="me-4 md:me-6 hover:bg-gray-700 hover:text-white block rounded-md px-3 py-2">Sign Up</a>
            </li>
            <li>
                <a th:href="@{/web/faq}"
                   class="me-4 md:me-6 hover:bg-gray-700 hover:text-white block rounded-md px-3 py-2">FAQ</a>
            </li>
        </ul>
    </div>
</footer>
</body>
</html>
